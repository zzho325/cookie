syntax = "proto3";

package llm;

enum OpenAIModel {
  OPEN_AI_MODEL_UNSPECIFIED = 0;
  OPEN_AI_MODEL_GPT_4O = 1;
  OPEN_AI_MODEL_GPT_4O_MINI = 2;
  OPEN_AI_MODEL_O4_MINI = 3;
  OPEN_AI_MODEL_O3 = 4;
  OPEN_AI_MODEL_O3_MINI = 5;
}

message OpenAISettings {
  // Whether to enable open ai native web search.
  bool web_search = 2;
  reserved 1;
}

enum GeminiModel {
  GEMINI_MODEL_UNSPECIFIED = 0;
  GEMINI_MODEL_3_PRO_PREVIEW = 1;
  GEMINI_MODEL_3_FLASH_PREVIEW = 2;
}

message GeminiSettings {
}

message LlmSettings {
  oneof default_model {
    OpenAIModel openai_model = 3;
    GeminiModel gemini_model = 4;
  }
  OpenAISettings open_ai = 1;
  GeminiSettings gemini = 2;
}
